name: Testes JSR Fitness
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar testes
        run: npm test
      - name: Verificar sintaxe JavaScript
        run: |
          node --check app.js
          node --check core.js
